name: Native file QA (manual, verified CI package)
run-name: READ ONLY exact winit Windows license link probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: winit-license-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  winit-license-probe:
    if: github.repository == 'qptywoei777-rgb/kio-native-apps' && github.ref == 'refs/heads/codex/design-winit-license-probe-20261016' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout this immutable diagnostic branch commit only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: qptywoei777-rgb/kio-native-apps
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install same fixed Rust compiler for metadata only
        run: rustup toolchain install 1.95.0 --profile minimal --target x86_64-pc-windows-msvc
      - name: Authenticate original Git blobs and record exact Windows link and unchanged production guard
        run: python scripts/probe_winit_windows_license.py
      - name: Retain bounded exact public legal fixture and Windows diagnostic on success or failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: winit-windows-license-probe-${{ github.run_id }}
          path: winit-license-probe-evidence/
          if-no-files-found: error
          retention-days: 14
